<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="100%" height="100%">
  <defs>
    <!-- Strap Silicone -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="30%" stop-color="#312E81"/>
      <stop offset="70%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Watch Case Metal (Titanium / Matte Dark) -->
    <linearGradient id="watchCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Watch Display -->
    <radialGradient id="screenRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="90%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Digital Crown Orange Accent -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#watchShadow)">
    <!-- Top Silicone Strap -->
    <path d="M 68 30 L 172 30 L 165 110 L 75 110 Z" fill="url(#strapGrad)"/>
    <!-- Top Strap Ribbing -->
    <line x1="80" y1="50" x2="160" y2="50" stroke="#1E1B4B" stroke-width="2"/>
    <line x1="82" y1="70" x2="158" y2="70" stroke="#1E1B4B" stroke-width="2"/>
    <line x1="84" y1="90" x2="156" y2="90" stroke="#1E1B4B" stroke-width="2"/>

    <!-- Bottom Silicone Strap -->
    <path d="M 75 270 L 165 270 L 172 350 L 68 350 Z" fill="url(#strapGrad)"/>
    <!-- Bottom Strap Holes -->
    <rect x="115" y="290" width="10" height="4" rx="2" fill="#0F172A"/>
    <rect x="115" y="310" width="10" height="4" rx="2" fill="#0F172A"/>
    <rect x="115" y="330" width="10" height="4" rx="2" fill="#0F172A"/>

    <!-- Watch Digital Crown & Action Button -->
    <rect x="194" y="145" width="12" height="34" rx="4" fill="url(#crownGrad)" stroke="#B45309" stroke-width="1"/>
    <rect x="193" y="205" width="8" height="24" rx="3" fill="#334155"/>

    <!-- Main Titanium Watch Case -->
    <rect x="40" y="95" width="155" height="190" rx="38" fill="url(#watchCase)" stroke="#94A3B8" stroke-width="2"/>

    <!-- Inner Bezel -->
    <rect x="46" y="101" width="143" height="178" rx="32" fill="#000000"/>

    <!-- OLED Screen -->
    <rect x="52" y="107" width="131" height="166" rx="28" fill="url(#screenRadial)"/>

    <!-- Fitness Rings (Activity Rings) -->
    <!-- Outer Cyan Ring -->
    <circle cx="117.5" cy="180" r="48" fill="none" stroke="#1E293B" stroke-width="8"/>
    <circle cx="117.5" cy="180" r="48" fill="none" stroke="#06B6D4" stroke-width="8" stroke-dasharray="240" stroke-dashoffset="60" stroke-linecap="round"/>
    <!-- Middle Purple Ring -->
    <circle cx="117.5" cy="180" r="36" fill="none" stroke="#1E293B" stroke-width="7"/>
    <circle cx="117.5" cy="180" r="36" fill="none" stroke="#8B7CFF" stroke-width="7" stroke-dasharray="190" stroke-dashoffset="30" stroke-linecap="round"/>
    <!-- Inner Gold Ring -->
    <circle cx="117.5" cy="180" r="25" fill="none" stroke="#1E293B" stroke-width="6"/>
    <circle cx="117.5" cy="180" r="25" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="140" stroke-dashoffset="20" stroke-linecap="round"/>

    <!-- Time & Heart Rate Indicator -->
    <text x="117.5" y="140" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">10:09</text>
    <text x="117.5" y="185" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">♥ 78</text>
    <text x="117.5" y="240" fill="#22D3EE" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">POINTS +40</text>

    <!-- Glass Specular Curve -->
    <path d="M 54 112 C 100 110, 150 140, 160 170" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
