<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="100%" height="100%">
  <defs>
    <!-- Screen Wallpaper: Warm peach + soft blush pink + coral glow -->
    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="35%" stop-color="#FDA4AF"/>
      <stop offset="70%" stop-color="#F56F6A"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Warm Rose-Gold / Light Aluminum Frame -->
    <linearGradient id="phoneFrameMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5A6A1"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <!-- Specular Gloss -->
    <linearGradient id="phoneSheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Warm Drop Shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="18" stdDeviation="18" flood-color="#F43F5E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#phoneShadow)">
    <!-- Outer Rose-Gold / Champagne Rim Chassis -->
    <rect x="15" y="10" width="210" height="450" rx="42" fill="url(#phoneFrameMetal)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Inner Slim Edge Bevel -->
    <rect x="18" y="13" width="204" height="444" rx="39" fill="#1E293B"/>

    <!-- AMOLED Display Screen -->
    <rect x="23" y="18" width="194" height="434" rx="35" fill="url(#phoneScreenGrad)"/>

    <!-- Dynamic Island Pill Notch -->
    <rect x="92" y="28" width="56" height="18" rx="9" fill="#0F172A"/>
    <circle cx="134" cy="37" r="4.5" fill="#1E293B"/>
    <circle cx="134" cy="37" r="2" fill="#F472B6" opacity="0.8"/>

    <!-- Phone Screen UI: Time & Status Icons -->
    <text x="46" y="41" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">9:41</text>
    <path d="M 175 34 L 175 40 M 179 32 L 179 40 M 183 30 L 183 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="190" y="32" width="16" height="8" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="192" y="34" width="11" height="4" rx="1" fill="#FFFFFF"/>

    <!-- On-screen Loyalty Notification Card (Blush glass) -->
    <rect x="35" y="75" width="170" height="66" rx="16" fill="rgba(255, 255, 255, 0.88)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="58" cy="108" r="14" fill="#F56F6A"/>
    <text x="58" y="112" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">★</text>
    <text x="80" y="100" fill="#171717" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">ELECTROLOYAL</text>
    <text x="80" y="116" fill="#F56F6A" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">+690 Points Earned!</text>
    <text x="80" y="129" fill="#881337" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Diamond VIP Tier Active</text>

    <!-- Glass Glare Sheen -->
    <path d="M 23 18 L 155 18 L 23 370 Z" fill="url(#phoneSheen)"/>

    <!-- Bottom Home Bar -->
    <rect x="85" y="440" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
