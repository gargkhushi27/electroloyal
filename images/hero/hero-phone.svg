<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="100%" height="100%">
  <defs>
    <!-- Screen Wallpaper -->
    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="30%" stop-color="#6D5DFB"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Titanium Frame Gradient -->
    <linearGradient id="phoneFrameMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Specular Gloss -->
    <linearGradient id="phoneSheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="25" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#phoneShadow)">
    <!-- Outer Titanium Rim / Chassis -->
    <rect x="15" y="10" width="210" height="450" rx="42" fill="url(#phoneFrameMetal)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Inner Edge Bevel -->
    <rect x="18" y="13" width="204" height="444" rx="39" fill="#0F172A"/>

    <!-- AMOLED Display Screen -->
    <rect x="23" y="18" width="194" height="434" rx="35" fill="url(#phoneScreenGrad)"/>

    <!-- Dynamic Island / Punch Hole Notch -->
    <rect x="92" y="28" width="56" height="18" rx="9" fill="#000000"/>
    <circle cx="134" cy="37" r="4.5" fill="#0F172A"/>
    <circle cx="134" cy="37" r="2" fill="#06B6D4" opacity="0.8"/>

    <!-- Phone Screen UI: Status Icons -->
    <text x="46" y="41" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">9:41</text>
    <!-- Signal & Battery -->
    <path d="M 175 34 L 175 40 M 179 32 L 179 40 M 183 30 L 183 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="190" y="32" width="16" height="8" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="192" y="34" width="11" height="4" rx="1" fill="#FFFFFF"/>

    <!-- On-screen Loyalty App Notification Pill -->
    <rect x="35" y="70" width="170" height="65" rx="16" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <circle cx="58" cy="102" r="14" fill="#6D5DFB"/>
    <text x="58" y="106" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">★</text>
    <text x="80" y="96" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ELECTROLOYAL</text>
    <text x="80" y="112" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="10">+690 Points Earned!</text>
    <text x="80" y="124" fill="#FEF08A" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Diamond VIP Tier Reached</text>

    <!-- Glass Glare / Gloss across entire front -->
    <path d="M 23 18 L 160 18 L 23 380 Z" fill="url(#phoneSheen)"/>

    <!-- Bottom Home Indicator Bar -->
    <rect x="85" y="440" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
