<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <!-- Ceramic Soft Blush / Warm Pearl Case -->
    <radialGradient id="caseLid" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF1F2"/>
      <stop offset="75%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F5A6A1"/>
    </radialGradient>

    <!-- Earbud Body Gradient (Clean Pearl White with warm pink sheen) -->
    <linearGradient id="budGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <!-- Metallic Acoustic Mesh Grille -->
    <radialGradient id="meshDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Soft Warm Drop Shadow -->
    <filter id="budsShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#F43F5E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#budsShadow)">
    <!-- CHARGING CASE BASE (Soft Blush Ceramic) -->
    <ellipse cx="140" cy="180" rx="90" ry="60" fill="url(#caseLid)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Case Split Line & LED Status Indicator -->
    <path d="M 52 178 C 90 195, 190 195, 228 178" fill="none" stroke="#F43F5E" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="140" cy="192" r="3" fill="#10B981"/>
    <circle cx="140" cy="192" r="6" fill="#10B981" opacity="0.3"/>

    <!-- LEFT EARBUD (Floating slightly above case) -->
    <g transform="translate(45, 20) rotate(-18 70 70)">
      <!-- Silicone Ear Tip -->
      <ellipse cx="62" cy="50" rx="14" ry="18" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="1"/>
      <ellipse cx="60" cy="50" rx="7" ry="11" fill="url(#meshDark)"/>
      <!-- Main Earbud Head -->
      <ellipse cx="80" cy="55" rx="22" ry="24" fill="url(#budGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Acoustic Vent -->
      <ellipse cx="88" cy="46" rx="4" ry="7" fill="url(#meshDark)"/>
      <!-- Downward Stem -->
      <rect x="75" y="68" width="12" height="42" rx="6" fill="url(#budGrad)" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Rose-Gold Charging Contacts -->
      <path d="M 75 104 L 87 104 L 85 110 L 77 110 Z" fill="#F56F6A"/>
    </g>

    <!-- RIGHT EARBUD (Floating beside case) -->
    <g transform="translate(160, 35) rotate(22 70 70)">
      <!-- Silicone Ear Tip -->
      <ellipse cx="98" cy="50" rx="14" ry="18" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="1"/>
      <ellipse cx="100" cy="50" rx="7" ry="11" fill="url(#meshDark)"/>
      <!-- Main Earbud Head -->
      <ellipse cx="80" cy="55" rx="22" ry="24" fill="url(#budGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Acoustic Vent -->
      <ellipse cx="72" cy="46" rx="4" ry="7" fill="url(#meshDark)"/>
      <!-- Downward Stem -->
      <rect x="73" y="68" width="12" height="42" rx="6" fill="url(#budGrad)" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Rose-Gold Charging Contacts -->
      <path d="M 73 104 L 85 104 L 83 110 L 75 110 Z" fill="#F56F6A"/>
    </g>
  </g>
</svg>
