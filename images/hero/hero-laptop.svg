<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Screen wallpaper gradient: Soft blush peach-pink with warm lavender glow -->
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="35%" stop-color="#FDA4AF"/>
      <stop offset="70%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>

    <!-- Premium Silver/Rose-Gold Aluminum Bevel Gradients -->
    <linearGradient id="lidBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="baseMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Trackpad Gradient -->
    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Soft Warm Drop Shadow (No harsh dark shadows) -->
    <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#F43F5E" flood-opacity="0.14"/>
    </filter>

    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#laptopShadow)">
    <!-- Base Lower Chassis Drop Lip (Slim rose-silver) -->
    <path d="M 60 330 L 540 330 Q 555 330 545 342 L 515 358 Q 500 364 480 364 L 120 364 Q 100 364 85 358 L 55 342 Q 45 330 60 330 Z" fill="#E2E8F0"/>
    <path d="M 65 332 L 535 332 L 510 354 L 90 354 Z" fill="#CBD5E1"/>

    <!-- Bottom Chassis (Keyboard Deck - 3D Perspective) -->
    <polygon points="50,325 550,325 480,240 120,240" fill="url(#baseMetal)"/>

    <!-- Keyboard Deck Edge Highlight -->
    <polygon points="48,325 552,325 550,328 50,328" fill="#FFFFFF"/>

    <!-- Keyboard Recess -->
    <polygon points="140,246 460,246 475,295 125,295" fill="#E2E8F0" rx="4"/>

    <!-- Keyboard Key Rows (Crisp clean white-silver keys) -->
    <g fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8">
      <polygon points="146,249 454,249 456,256 144,256"/>
      <polygon points="143,258 457,258 460,266 140,266"/>
      <polygon points="139,268 461,268 464,277 136,277"/>
      <polygon points="135,279 465,279 469,289 131,289"/>
      <polygon points="130,290 470,290 473,293 127,293" fill="#F8FAFC"/>
    </g>

    <!-- Trackpad -->
    <polygon points="255,298 345,298 350,320 250,320" fill="url(#trackpadGrad)" stroke="#CBD5E1" stroke-width="0.8"/>

    <!-- Display Hinge -->
    <rect x="220" y="235" width="160" height="7" rx="3" fill="#94A3B8"/>

    <!-- Screen Outer Bezel (Ultra-slim white/silver bezel) -->
    <rect x="110" y="30" width="380" height="210" rx="12" fill="#1E293B" stroke="url(#lidBevel)" stroke-width="3"/>

    <!-- Display Glass Panel with Warm Wallpaper -->
    <rect x="120" y="40" width="360" height="190" rx="6" fill="url(#laptopScreenGrad)"/>

    <!-- Camera Dot -->
    <circle cx="300" cy="35" r="2" fill="#475569"/>
    <circle cx="300" cy="35" r="0.8" fill="#67E8F9"/>

    <!-- On-screen UI Preview: Clean Retail Dashboard Cards -->
    <rect x="135" y="52" width="330" height="20" rx="4" fill="rgba(255, 255, 255, 0.45)"/>
    <circle cx="148" cy="62" r="3" fill="#F56F6A"/>
    <circle cx="158" cy="62" r="3" fill="#FBBF24"/>
    <circle cx="168" cy="62" r="3" fill="#34D399"/>
    <rect x="185" y="59" width="60" height="6" rx="3" fill="rgba(255, 255, 255, 0.8)"/>
    <rect x="400" y="57" width="55" height="10" rx="5" fill="#F56F6A"/>

    <!-- Mini Analytics Graph inside screen -->
    <path d="M 145 185 Q 210 135 270 155 T 370 115 T 455 90" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 145 185 Q 210 135 270 155 T 370 115 T 455 90 L 455 210 L 145 210 Z" fill="rgba(255, 255, 255, 0.22)"/>

    <!-- Diagonal Glass Glare Reflection -->
    <polygon points="120,40 330,40 210,230 120,230" fill="url(#glassGloss)"/>
  </g>
</svg>
